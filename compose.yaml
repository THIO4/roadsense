# Local development with Docker Compose.
#   docker compose up --build          # API at http://localhost:8000
#   docker compose run --rm collector  # one collection run into Cosmos
# Both services share ONE image; only the command differs. Settings come from .env
# (gitignored) - the same variables Azure will supply as container env vars/secrets.
services:
  api:
    build: .
    image: roadsense:local
    env_file: .env
    ports:
      - "8000:8000"

  collector:
    image: roadsense:local   # reuse the image built by `api`
    build: .
    env_file: .env
    command: roadsense-collector collect
    profiles: ["tools"]      # not started by `docker compose up`; run on demand
